<!DOCTYPE html>
<html lang="ptbr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Caixa Registradora</title>
</head>
<body>
    <header>
        <h1>Login</h1>
    </header>
    <div class="form_box">
        <form>
            <h2 id="wlcm">Bem-Vindo</h2>
            <div class="campos">
                <label for="usuario">
                    Usuário
                </label>
                <input type="text" name="usuario" id="user_nm">
            </div>
            <div class="campos">
                <label for="senha">Senha</label>
                <input type="password" name="senha" id="psw">
            </div>
            <div class="showPass">
                <input type="checkbox" name="showPss" id="box_pass">
                <p>Mostrar Senha</p>
            </div>
            <div class="rgst">
                <a href="./register.html">Registrar-se</a>
            </div>
            <button type="submit" id="lg_btn">Entrar</button>
                      
        </form>
    </div>
</body>
</html>
