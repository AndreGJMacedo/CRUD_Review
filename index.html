<!DOCTYPE html>
<html lang="ptbr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/controllers/LoginFuncions.js" defer></script>
    <title>Caixa Registradora</title>
</head>
<body>
    <header>
        <h1>Login</h1>
    </header>
    <div class="form_box">
        <form>
            <h2 id="wlcm">Bem-Vindo</h2>
            <div class="campos">
                <label for="usuario">
                    Usuário
                </label>
                <input type="text" name="usuario" oninput="validate_user()" id="user_nm" placeholder="UserName">
            </div>
            <div class="campos">
                <label for="senha">Senha</label>
                <input type="password" name="senha" id="psw" placeholder="Passwod">
            </div>
            <div class="showPass">
                <input type="checkbox" name="showPss" id="box_pass" onclick="showPass()" >
                <p>Mostrar Senha</p>
            </div>

            <button type="submit" id="lg_btn" disabled=>Entrar</button>

             <div class="rgst">
                <a href="#">Recuperar senha</a>
                <a href="#">Registrar-se</a>
            </div>
                      
        </form>
    </div>
</body>
</html>
